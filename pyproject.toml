[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifcm-expert-panel"
version = "0.1.0"
description = "Reproducible analyses for LLM expert panel fuzzy cognitive maps"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4"]

[project.scripts]
ifcm = "ifcm.cli:main"

[tool.setuptools.packages.find]
include = ["ifcm*"]
